<style>

    display: flex; flex-direction: column; justify-content: flex-start; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  /* centred by auto margins, not justify-content: a centred flex column that overflows clips its top out of scroll reach */

  /* the title scales with height as well as width, so a short laptop window does not get a 72px three-line title */

  #keepBtn { margin-top: 2.2em; font-size: 12px; letter-spacing: .35em; text-transform: uppercase; color: rgba(224,138,74,0.75); border-bottom: 1px solid rgba(224,138,74,0.3); padding: 8px 4px; transition: opacity 2.4s ease, color .3s; }
  #keepBtn:hover, #keepBtn:focus-visible { color: var(--ember); outline: none; }
  /* Side by side on wide screens. The two columns centre themselves with auto margins rather than align-items:

  #ending { overflow-y: auto; flex-direction: row; align-items: flex-start; gap: 6vw; }

  #endPlan { flex: none; margin-block: auto; }
  @media (min-width: 900px) and (max-height: 640px) {

  @media (max-width: 899px) {

  #dev h3 { margin: 0 0 6px; font-size: 11px; color: #8f8; }

  @media (max-width: 760px) {

    #reader .pane { width: 100%; min-height: 0; max-height: none; height: 78vh; height: 78dvh;
      padding: 36px 22px calc(30px + env(safe-area-inset-bottom, 0px));
      -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 30px); mask-image: linear-gradient(180deg, transparent 0, #000 30px);
      background: linear-gradient(0deg, rgba(6,4,3,0.94) 0%, rgba(6,4,3,0.86) 75%, rgba(6,4,3,0) 100%); }
    #ribbon { left: 22px; }
    #skipHint { display: none; }
    /* phones only: the pane steps aside while the camera moves between nodes (.reveal) and while a finger rests on the

    #reader .pane { transition: opacity .45s ease; }
    #reader.peek .pane, #reader.reveal .pane, #reader.peek #peekHint, #reader.reveal #peekHint { opacity: 0; }
    #peekHint { display: block; }
    #scene { touch-action: none; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
    #veil { background: radial-gradient(ellipse at 50% 28%, transparent 40%, rgba(0,0,0,0.55) 100%); }
    #dev { width: auto; left: 8px; right: 8px; max-height: 40vh; }
  }
  @media (max-width: 760px) {
    #reader .pane > #nodeTitle { margin-top: 0; }

    #title { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px));
      -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 64px); mask-image: linear-gradient(180deg, transparent 0, #000 64px); }
  }

  @media (pointer: coarse) {

<canvas id="scene" aria-hidden="true"></canvas>
<div id="veil"></div>

<div id="corner">

<script type="module">
import { createHouse, LOCATIONS, PALETTE_NAMES, CAMERAS, FIGURE_WHO } from './house.js';
import { createAudio } from './audio.js';
import { createState, applySet, renderText, visibleChoices, coerce, parseText, pickBranch, evalExpr } from './engine.js';
import { createNarration } from './narration.js';
import { bindKeep } from './share.js';
import { showPlan, roomsVisited, mergeRooms } from './plan.js';

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const DEV = params.get('dev') === '1';
const MUSICS = ['drone', 'waltz', 'lullaby', 'heartbeat', 'silence', 'choir'];
const NARRATION_VOICE = 'callum'; // folder under site/narration/ baked by scripts/narrate.mjs; Web Speech if absent

// ------------------------------------------------------------------ memory
const KEY = 'marrowHouse.v1';
function loadStore() {
  try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && typeof s === 'object') return { visits: 0, found: {}, lastEnding: null, prefs: {}, ...s }; } catch (e) { /* private mode */ }
  return { visits: 0, found: {}, lastEnding: null, prefs: {} };
}
let store = loadStore();
function saveStore() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* ignore */ } }

// ------------------------------------------------------------------ story
let story = null, nodes = {}, totalEndings = 0;
// Endings this browser has found that still exist in the current story. Old builds left ids in localStorage that
// no longer name an ending; they are ignored (not deleted) so the wall and every "n of N" count agree.
function foundEndings() {
  if (!story) return [];
  return Object.entries(store.found || {}).filter(([id]) => story.nodes[id] && story.nodes[id].ending)
    .map(([id, f]) => { const e = story.nodes[id].ending; return { ...f, id, title: e.title || f.title, epitaph: e.epitaph || f.epitaph, kind: e.kind || f.kind }; });
}
function normalise(raw) {
  const list = Array.isArray(raw) ? raw : Array.isArray(raw.nodes) ? raw.nodes : Object.entries(raw.nodes || {}).map(([id, n]) => ({ id, ...n }));
  const map = {}; for (const n of list) map[n.id] = n;
  let flags = raw.flags;
  if (!flags) { // infer like the build script does
    flags = {};
    for (const n of list) for (const c of n.choices || []) for (const [k, v] of Object.entries(c.set || {})) if (!(k in flags)) flags[k] = typeof v === 'string' && /^[+-]\d+$/.test(v) ? 0 : typeof v === 'number' ? 0 : typeof v === 'string' ? null : false;
  }
  return { start: raw.start || 'a1_porch', flags, nodes: map, title: raw.title };
}
async function loadStory() {
  const tries = [params.get('story'), 'story.json', 'story.sample.json'].filter(Boolean);
  for (const url of [...new Set(tries)]) {
    try { const r = await fetch(url, { cache: 'no-cache' }); if (!r.ok) continue; const j = await r.json(); console.info('[marrow] story loaded from', url); return normalise(j); }
    catch (e) { console.warn('[marrow] could not load', url, e.message); }
  }
  throw new Error('No story found (tried ' + tries.join(', ') + ').');
}

// ------------------------------------------------------------------ narration
const narrator = {
  enabled: false, voice: null,
  pick() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices(); if (!vs.length) return;
    const en = vs.filter((v) => /^en/i.test(v.lang));
    this.voice = en.find((v) => /Daniel|Serena|Google UK English/i.test(v.name)) || en.find((v) => /en[-_]GB/i.test(v.lang)) || en[0] || vs[0];
  },
  speak(text) {

    const list = lists[c]; const cur = list.indexOf(house.directive[field]); const next = list[(cur + 1) % list.length];
    const nd = { ...house.directive, [field]: next }; if (c === 'loc') nd.props = null;
    console.log('[dev scene]', JSON.stringify(nd)); setScene(nd); devRender();
  }));
  d.querySelectorAll('[data-f]').forEach((inp) => (inp.onchange = () => {
    let v; try { v = JSON.parse(inp.value); } catch (e) { v = coerce(inp.value); }
    flags = { ...flags, [inp.dataset.f]: v }; updateRibbon(); console.log('[dev flags]', flags);
  }));
}
function devJump(id) {
  if (!story || !story.nodes[id]) { console.warn('[dev] no node', id); return; }
  if (mode === 'title' || !Object.keys(flags).length) { path = []; flags = createState(story.flags, { visits: store.visits, last_ending: store.lastEnding ?? null, endings_found: foundEndings().length }); }
  mode = 'play'; show('reader'); goTo(id);
}

// ------------------------------------------------------------------ boot
setScene({ ...TITLE_SCENE, ...(store.visits > 0 ? { palette: 'bruise', fog: 0.2 } : {}) });
house.fadeTo(1, 5);
renderTitle(); show('title'); devRender();
loadStory().then((s) => {
  story = s;
  totalEndings = Object.values(s.nodes).filter((n) => n.ending).length;
  renderTitle(); devRender();
}).catch((e) => {
  console.error(e); $('storyError').hidden = false; $('storyError').textContent = 'The house is not ready yet. ' + e.message; $('approach').disabled = true;
});
</script>
